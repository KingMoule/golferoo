name: CI

on:
  pull_request:
  push:
    branches: [main] # une branche de chantier tourne par sa PR : la doubler d'un push occupait deux fois les runners
  workflow_dispatch:

# Un nouveau commit d'une PR annule le run précédent de cette PR ; sur main, chaque fusion garde son run (artefact Windows).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # La simulation en trois jobs parallèles (format et banc, tests en lots) : en série sur un runner, tests puis banc prenaient 12 à 22 min.
  # Le job « Simulation (format, tests, banc) », exigé par le ruleset de main, ne fait que rendre leur verdict.
  sim-checks:
    name: Simulation, format et banc
    runs-on: ubuntu-latest
    timeout-minutes: 15 # banc de 3 à 6 min selon le runner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # Repli si le serveur de téléchargement de Microsoft est en panne (HTTP 409 le 2026-10-25) :
      # le SDK .NET 10 des paquets Ubuntu satisfait global.json (10.0.100, latestFeature).
      - name: .NET depuis les paquets Ubuntu (repli)
        if: steps.dotnet.outcome == 'failure'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dotnet-sdk-10.0
          echo "DOTNET_ROOT=/usr/lib/dotnet" >> "$GITHUB_ENV"
          echo "/usr/lib/dotnet" >> "$GITHUB_PATH"

      - name: Golferoo.Sim ne référence pas Godot
        run: |
          if grep -rnE 'using Godot|GodotSharp|Godot\.NET\.Sdk' src/Golferoo.Sim --include='*.cs' --include='*.csproj'; then
            echo "::error::Golferoo.Sim doit rester sans dépendance à Godot (ADR 0001)."
            exit 1
          fi

      - name: Les sons synthétisés sont ceux du dépôt
        run: |
          python3 -I tools/audio/synth.py
          git diff --exit-code -- game/assets/audio
          test -z "$(git status --porcelain game/assets/audio)"

      - run: dotnet restore Golferoo.sln

      - name: Format
        run: dotnet format Golferoo.sln --verify-no-changes --no-restore

      - run: dotnet build Golferoo.sln -c Release --no-restore

      - name: Banc
        run: dotnet run -c Release --no-build --project tests/Golferoo.Sim.Bench -- --out bench.json

      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json

  sim-tests:
    name: Simulation, tests (lot ${{ matrix.lot }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 4 à 8 min par lot selon le runner
    strategy:
      fail-fast: false
      matrix:
        lot: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # Repli si le serveur de téléchargement de Microsoft est en panne (HTTP 409 le 2026-10-25) :
      # le SDK .NET 10 des paquets Ubuntu satisfait global.json (10.0.100, latestFeature).
      - name: .NET depuis les paquets Ubuntu (repli)
        if: steps.dotnet.outcome == 'failure'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dotnet-sdk-10.0
          echo "DOTNET_ROOT=/usr/lib/dotnet" >> "$GITHUB_ENV"
          echo "/usr/lib/dotnet" >> "$GITHUB_PATH"

      - run: dotnet build tests/Golferoo.Sim.Tests -c Release

      # Lots 1 et 2 : les classes nommées ci-dessous (équilibrées sur les durées mesurées le 2026-11-04). Lot 3 : toutes les autres,
      # donc toute nouvelle classe de tests y tourne sans rien changer ici. Pour rééquilibrer, déplacer un nom d'une liste à l'autre.
      - name: Tests
        env:
          LOT: ${{ matrix.lot }}
          LOT_1: ProSeasonTests SaveTests NewGameTests RatingTests ArrivalTests
          LOT_2: ProfileTests LeagueTests NewHoleTests LeagueFinalTests
        run: |
          case "$LOT" in
            1) filter=$(printf 'FullyQualifiedName~Golferoo.Sim.Tests.%s.|' $LOT_1) ;;
            2) filter=$(printf 'FullyQualifiedName~Golferoo.Sim.Tests.%s.|' $LOT_2) ;;
            *) filter=$(printf 'FullyQualifiedName!~Golferoo.Sim.Tests.%s.&' $LOT_1 $LOT_2) ;;
          esac
          dotnet test tests/Golferoo.Sim.Tests -c Release --no-build --filter "${filter%[|&]}" --logger "console;verbosity=normal"

  sim:
    name: Simulation (format, tests, banc)
    needs: [sim-checks, sim-tests]
    if: always() # rouge, et non « ignoré » (qu'un ruleset prend pour vert), si un job de la simulation échoue ou est annulé
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        run: |
          echo "format et banc : ${{ needs.sim-checks.result }} ; tests : ${{ needs.sim-tests.result }}"
          test "${{ needs.sim-checks.result }}" = success && test "${{ needs.sim-tests.result }}" = success

  godot:
    name: Godot headless (import et fumée)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # Repli si le serveur de téléchargement de Microsoft est en panne (HTTP 409 le 2026-10-25) :
      # le SDK .NET 10 des paquets Ubuntu satisfait global.json (10.0.100, latestFeature).
      - name: .NET depuis les paquets Ubuntu (repli)
        if: steps.dotnet.outcome == 'failure'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dotnet-sdk-10.0
          echo "DOTNET_ROOT=/usr/lib/dotnet" >> "$GITHUB_ENV"
          echo "/usr/lib/dotnet" >> "$GITHUB_PATH"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Télécharger Godot .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          mkdir -p ~/godot
          unzip -q godot.zip -d ~/godot

      - name: Repérer l'exécutable
        run: |
          bin="$(find ~/godot -maxdepth 2 -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          test -n "$bin" || { echo "::error::exécutable Godot introuvable"; exit 1; }
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Compiler le jeu
        run: dotnet build game/Golferoo.Game.csproj

      - name: Import
        run: timeout 300 "$GODOT" --headless --path game --import

      - name: Test de fumée
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path game --audio-driver Dummy res://tests/Smoke.tscn 2>&1 | tee smoke.log
          grep -q '^HOLE source=res://data/courses/' smoke.log || { echo "::error::le JSON du parcours n'est pas lu depuis res://"; exit 1; }
          grep -qE '^COURSE OK 9 ' smoke.log || { echo "::error::la ligne COURSE OK 9 est absente"; exit 1; }
          grep '^COURSE OK' smoke.log >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^NEWHOLE OK holes=3 ' smoke.log || { echo "::error::la ligne NEWHOLE OK est absente"; exit 1; }
          grep '^NEWHOLE OK' smoke.log >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^SAVE OK checksum=([0-9a-f]{16}) apres=\1 serialisation=[0-9.]+ ms$' smoke.log || { echo "::error::la ligne SAVE OK (mêmes sommes avant et après) est absente"; exit 1; }
          grep '^SAVE OK' smoke.log >> "$GITHUB_STEP_SUMMARY"
          grep -q '^SMOKE OK' smoke.log || { echo "::error::la ligne SMOKE OK est absente"; exit 1; }
          if grep -E '^(ERROR:|SCRIPT ERROR)' smoke.log; then echo "::error::erreurs Godot dans la fumée"; exit 1; fi

  captures:
    name: Captures (rendu logiciel)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # deux tours de captures de 12 min au plus (C16 lot 4)
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # Repli si le serveur de téléchargement de Microsoft est en panne (HTTP 409 le 2026-10-25) :
      # le SDK .NET 10 des paquets Ubuntu satisfait global.json (10.0.100, latestFeature).
      - name: .NET depuis les paquets Ubuntu (repli)
        if: steps.dotnet.outcome == 'failure'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dotnet-sdk-10.0
          echo "DOTNET_ROOT=/usr/lib/dotnet" >> "$GITHUB_ENV"
          echo "/usr/lib/dotnet" >> "$GITHUB_PATH"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Télécharger Godot .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          mkdir -p ~/godot
          unzip -q godot.zip -d ~/godot

      - name: Repérer l'exécutable
        run: |
          bin="$(find ~/godot -maxdepth 2 -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          test -n "$bin" || { echo "::error::exécutable Godot introuvable"; exit 1; }
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      - name: Pilotes de rendu logiciel
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-vulkan-drivers libgl1-mesa-dri libvulkan1 libxcursor1 libxinerama1 libxi6 libxrandr2

      - name: Compiler et importer
        run: |
          dotnet build game/Golferoo.Game.csproj
          timeout 300 "$GODOT" --headless --path game --import

      - name: Captures (Forward+ via lavapipe, sinon Compatibility via llvmpipe)
        run: |
          run_captures() {
            rm -rf captures
            timeout 720 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path game --audio-driver Dummy "$@" res://tools/Captures.tscn -- --out "$GITHUB_WORKSPACE/captures" --thumbs --full 2>&1 | tee captures.log
            return "${PIPESTATUS[0]}"
          }
          if run_captures --rendering-method forward_plus --rendering-driver vulkan \
              && grep -q '^CAPTURES OK' captures.log && grep -q '^C11 .* OK$' captures.log && ! grep -E '^(ERROR:|SCRIPT ERROR)' captures.log; then
            echo "Rendu : Forward+ via lavapipe" | tee -a "$GITHUB_STEP_SUMMARY" rendu.txt
          else
            echo "::warning::Forward+ logiciel indisponible ou en erreur, repli sur Compatibility (llvmpipe)"
            mv captures.log captures-forwardplus.log 2>/dev/null || true
            run_captures --rendering-method gl_compatibility --rendering-driver opengl3 || { echo "::error::captures en échec"; exit 1; }
            grep -q '^CAPTURES OK' captures.log || { echo "::error::CAPTURES OK absent"; exit 1; }
            grep -q '^C11 .* OK$' captures.log || { echo "::error::C11 OK absent"; exit 1; }
            if grep -E '^(ERROR:|SCRIPT ERROR)' captures.log; then echo "::error::erreurs Godot dans les captures"; exit 1; fi
            echo "Rendu : Compatibility via llvmpipe" | tee -a "$GITHUB_STEP_SUMMARY" rendu.txt
          fi

      - name: Résumé C11 (sauvegarde au facteur du jeu)
        run: grep -E '^(C11 |C12 |SAVE )' captures.log | tail -n 12 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Captures des chantiers en cours (en fin de journal, pour la relecture sans artefact)
        # Les lignes FULL de toutes les captures pèsent plusieurs Mo : on remet celles des chantiers récents en dernier.
        run: |
          # Le résumé d'une étape ne se relit pas depuis une autre : la ligne « Rendu » est aussi gardée dans rendu.txt.
          cat rendu.txt || true
          grep -E '^FULL capture-[0-9]+-c(1[3-9]|2[0-9])-' captures.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: |
            captures/*.png
            captures*.log

  export-windows:
    name: Export Windows (artefact golferoo-windows)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          global-json-file: global.json

      # Repli si le serveur de téléchargement de Microsoft est en panne (HTTP 409 le 2026-10-25) :
      # le SDK .NET 10 des paquets Ubuntu satisfait global.json (10.0.100, latestFeature).
      - name: .NET depuis les paquets Ubuntu (repli)
        if: steps.dotnet.outcome == 'failure'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dotnet-sdk-10.0
          echo "DOTNET_ROOT=/usr/lib/dotnet" >> "$GITHUB_ENV"
          echo "/usr/lib/dotnet" >> "$GITHUB_PATH"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Télécharger Godot .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          mkdir -p ~/godot
          unzip -q godot.zip -d ~/godot

      - name: Repérer l'exécutable
        run: |
          bin="$(find ~/godot -maxdepth 2 -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          test -n "$bin" || { echo "::error::exécutable Godot introuvable"; exit 1; }
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      - name: Cache des modèles d'export
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono

      - name: Télécharger les modèles d'export
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono

      - name: Compiler et importer
        run: |
          echo "${GITHUB_SHA::7}" > data-version.tmp
          dotnet build game/Golferoo.Game.csproj
          mkdir -p game/data
          mv data-version.tmp game/data/version.txt
          timeout 300 "$GODOT" --headless --path game --import

      - name: Exporter
        run: |
          set -o pipefail
          mkdir -p build/windows
          timeout 900 "$GODOT" --headless --path game --export-release "Windows Desktop" ../build/windows/Golferoo.exe 2>&1 | tee export.log
          test -f build/windows/Golferoo.exe || { echo "::error::Golferoo.exe absent"; exit 1; }
          if grep -E '^(ERROR:|SCRIPT ERROR)' export.log; then echo "::error::erreurs Godot à l'export"; exit 1; fi

      - name: Fichiers pour Guillaume
        run: |
          cd build/windows
          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" Golferoo.exe\r\n' > Lancer.bat
          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" Golferoo.exe -- --tutorial\r\n' > Tutoriel.bat
          printf '@echo off\r\ncd /d "%%~dp0"\r\nGolferoo.exe -- --fps-bench\r\nGolferoo.exe -- --fps-bench-low\r\nGolferoo.exe -- --fps-bench-golfers 100\r\nGolferoo.exe -- --fps-bench-golfers 200\r\necho.\r\ntype fps-result.txt\r\necho.\r\ntype fps-result-low.txt\r\necho.\r\ntype fps-result-golfers-100.txt\r\necho.\r\ntype fps-result-golfers-200.txt\r\npause\r\n' > "Mesurer FPS.bat"
          printf '%s\r\n' \
            "GOLFEROO - prototype d'un trou (version ${GITHUB_SHA::7})" \
            "1. Dezippez tout le dossier (ne lancez pas le jeu depuis le zip)." \
            "2. Pour jouer : double-clic sur Lancer.bat (Tutoriel.bat ouvre directement le tutoriel de construction d'un trou)." \
            "3. Pour mesurer les FPS : double-clic sur Mesurer FPS.bat, attendez environ 110 secondes sans toucher a rien (deux mesures)." \
            "4. Envoyez-moi les fichiers fps-result.txt et fps-result-low.txt (crees dans ce dossier) ou une photo de l'ecran final." > LISEZMOI.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: golferoo-windows
          path: build/windows/
          if-no-files-found: error
