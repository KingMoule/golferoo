name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  sim:
    name: Simulation (format, tests, banc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Golferoo.Sim ne référence pas Godot
        run: |
          if grep -rnE 'using Godot|GodotSharp|Godot\.NET\.Sdk' src/Golferoo.Sim --include='*.cs' --include='*.csproj'; then
            echo "::error::Golferoo.Sim doit rester sans dépendance à Godot (ADR 0001)."
            exit 1
          fi

      - run: dotnet restore Golferoo.sln

      - name: Format
        run: dotnet format Golferoo.sln --verify-no-changes --no-restore

      - run: dotnet build Golferoo.sln -c Release --no-restore

      - name: Tests
        run: dotnet test Golferoo.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Banc
        run: dotnet run -c Release --no-build --project tests/Golferoo.Sim.Bench -- --out bench.json

      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json

  godot:
    name: Godot headless (import et fumée)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Télécharger Godot .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          mkdir -p ~/godot
          unzip -q godot.zip -d ~/godot

      - name: Repérer l'exécutable
        run: |
          bin="$(find ~/godot -maxdepth 2 -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          test -n "$bin" || { echo "::error::exécutable Godot introuvable"; exit 1; }
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Compiler le jeu
        run: dotnet build game/Golferoo.Game.csproj

      - name: Import
        run: timeout 300 "$GODOT" --headless --path game --import

      - name: Test de fumée
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path game res://tests/Smoke.tscn 2>&1 | tee smoke.log
          grep -q '^HOLE source=res://data/holes/' smoke.log || { echo "::error::le JSON du trou n'est pas lu depuis res://"; exit 1; }
          grep -q '^SMOKE OK' smoke.log || { echo "::error::la ligne SMOKE OK est absente"; exit 1; }
          if grep -E '^(ERROR:|SCRIPT ERROR)' smoke.log; then echo "::error::erreurs Godot dans la fumée"; exit 1; fi

  captures:
    name: Captures (rendu logiciel)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Télécharger Godot .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          mkdir -p ~/godot
          unzip -q godot.zip -d ~/godot

      - name: Repérer l'exécutable
        run: |
          bin="$(find ~/godot -maxdepth 2 -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          test -n "$bin" || { echo "::error::exécutable Godot introuvable"; exit 1; }
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      - name: Pilotes de rendu logiciel
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-vulkan-drivers libgl1-mesa-dri libvulkan1 libxcursor1 libxinerama1 libxi6 libxrandr2

      - name: Compiler et importer
        run: |
          dotnet build game/Golferoo.Game.csproj
          timeout 300 "$GODOT" --headless --path game --import

      - name: Captures (Forward+ via lavapipe, sinon Compatibility via llvmpipe)
        run: |
          run_captures() {
            rm -rf captures
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path game --audio-driver Dummy "$@" res://tools/Captures.tscn -- --out "$GITHUB_WORKSPACE/captures" --thumbs --full 2>&1 | tee captures.log
            return "${PIPESTATUS[0]}"
          }
          if run_captures --rendering-method forward_plus --rendering-driver vulkan \
              && grep -q '^CAPTURES OK' captures.log && ! grep -E '^(ERROR:|SCRIPT ERROR)' captures.log; then
            echo "Rendu : Forward+ via lavapipe" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Forward+ logiciel indisponible ou en erreur, repli sur Compatibility (llvmpipe)"
            mv captures.log captures-forwardplus.log 2>/dev/null || true
            run_captures --rendering-method gl_compatibility --rendering-driver opengl3 || { echo "::error::captures en échec"; exit 1; }
            grep -q '^CAPTURES OK' captures.log || { echo "::error::CAPTURES OK absent"; exit 1; }
            if grep -E '^(ERROR:|SCRIPT ERROR)' captures.log; then echo "::error::erreurs Godot dans les captures"; exit 1; fi
            echo "Rendu : Compatibility via llvmpipe" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          test "$(ls captures/*.png | wc -l)" -eq 10

      - name: Captures aux facteurs 3 et 4 (comparaison pour le rapport C01, le jeu est au facteur 2)
        run: |
          for f in 3 4; do
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path game --audio-driver Dummy --rendering-method forward_plus --rendering-driver vulkan \
              res://tools/Captures.tscn -- --out "$GITHUB_WORKSPACE/captures-f$f" --factor $f --prefix "f$f-" --full 2>&1 | tee "captures-f$f.log"
            grep -q '^CAPTURES OK' "captures-f$f.log" || { echo "::error::captures au facteur $f en échec"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: |
            captures/*.png
            captures*.log

  export-windows:
    name: Export Windows (artefact golferoo-windows)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Télécharger Godot .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          mkdir -p ~/godot
          unzip -q godot.zip -d ~/godot

      - name: Repérer l'exécutable
        run: |
          bin="$(find ~/godot -maxdepth 2 -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          test -n "$bin" || { echo "::error::exécutable Godot introuvable"; exit 1; }
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      - name: Cache des modèles d'export
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono

      - name: Télécharger les modèles d'export
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono

      - name: Compiler et importer
        run: |
          echo "${GITHUB_SHA::7}" > data-version.tmp
          dotnet build game/Golferoo.Game.csproj
          mkdir -p game/data
          mv data-version.tmp game/data/version.txt
          timeout 300 "$GODOT" --headless --path game --import

      - name: Exporter
        run: |
          set -o pipefail
          mkdir -p build/windows
          timeout 900 "$GODOT" --headless --path game --export-release "Windows Desktop" ../build/windows/Golferoo.exe 2>&1 | tee export.log
          test -f build/windows/Golferoo.exe || { echo "::error::Golferoo.exe absent"; exit 1; }
          if grep -E '^(ERROR:|SCRIPT ERROR)' export.log; then echo "::error::erreurs Godot à l'export"; exit 1; fi

      - name: Fichiers pour Guillaume
        run: |
          cd build/windows
          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" Golferoo.exe\r\n' > Lancer.bat
          printf '@echo off\r\ncd /d "%%~dp0"\r\nGolferoo.exe -- --fps-bench\r\necho.\r\ntype fps-result.txt\r\npause\r\n' > "Mesurer FPS.bat"
          printf '%s\r\n' \
            "GOLFEROO - prototype d'un trou (version ${GITHUB_SHA::7})" \
            "1. Dezippez tout le dossier (ne lancez pas le jeu depuis le zip)." \
            "2. Pour jouer : double-clic sur Lancer.bat." \
            "3. Pour mesurer les FPS : double-clic sur Mesurer FPS.bat, attendez environ 55 secondes sans toucher a rien." \
            "4. Envoyez-moi le fichier fps-result.txt (cree dans ce dossier) ou une photo de l'ecran final." > LISEZMOI.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: golferoo-windows
          path: build/windows/
          if-no-files-found: error
